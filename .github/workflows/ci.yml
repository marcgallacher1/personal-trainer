name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Reference-data migration is up to date with src/lib/seed
        run: |
          npm run gen:seed
          git diff --exit-code supabase/migrations
      - name: Edge Functions use the same notification code as the app
        run: |
          npm run gen:shared
          git diff --exit-code supabase/functions/_shared
      - name: Typecheck Edge Functions
        run: npx --yes deno@2.1.4 check supabase/functions/notify/index.ts supabase/functions/test-push/index.ts
        env:
          DENO_NO_PACKAGE_JSON: '1'
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase test db
